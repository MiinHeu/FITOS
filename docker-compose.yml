version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fitos
      POSTGRES_USER: fitos_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-supersecret}
      JWT_SECRET: ${JWT_SECRET:-superjwtsecret}
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  ai:
    build: 
      context: ./ai
      dockerfile: Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-fitos-ai-token}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://backend:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - ai

volumes:
  pgdata:
